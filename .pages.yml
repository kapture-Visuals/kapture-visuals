media:
  input: public/images/journal
  output: /images/journal

content:
  # ========================================
  # JOURNAL ARTICLES
  # ========================================

  - name: journal
    label: Journal Articles
    type: collection
    path: content/journal
    format: json
    filename: "{fields.slug}.json"

    view:
      fields:
        - title
        - eventStartDate
        - status
        - featured
      primary: title
      sort:
        - eventStartDate
        - title

    fields:
      - name: title
        label: Article Title
        type: string
        required: true

      - name: slug
        label: Article Slug
        type: string
        required: true

      - name: event
        label: Event ID
        type: string
        required: true

      - name: eventStartDate
        label: Event Start Date
        type: date

      - name: eventEndDate
        label: Event End Date
        type: date

      - name: city
        label: City
        type: string

      - name: country
        label: Country
        type: string

      - name: coverImage
        label: Cover Image
        type: image

      - name: excerpt
        label: Article Excerpt
        type: text

      - name: contributors
        label: Contributors
        type: reference
        options:
          collection: contributors
          multiple: true
          search: name
          value: "{fields.slug}"
          label: "{fields.name}"

      - name: status
        label: Publication Status
        type: select
        options:
          values:
            - draft
            - review
            - published

      - name: publishedAt
        label: Publication Date
        type: date

      - name: featured
        label: Featured Article
        type: boolean

      # ====================================
      # PHOTO GALLERY / ARTICLE RAILS
      # ====================================

      - name: gallery
        label: Photo Gallery
        type: object
        list: true
        fields:
          - name: src
            label: Image Path
            type: string
            required: true

          - name: orientation
            label: Orientation
            type: select
            required: true
            options:
              values:
                - portrait
                - landscape

          - name: section
            label: Article Section
            type: number
            required: true

          - name: position
            label: Paragraph Position
            type: select
            required: true
            options:
              values:
                - after-1
                - after-2
                - after-3
                - after-4
                - after-5
                - after-6
                - after-7
                - after-8
                - after-9
                - after-10

          - name: side
            label: Rail Side
            type: select
            required: true
            options:
              values:
                - left
                - right

          - name: group
            label: Image Group
            type: string
            required: false

      # ====================================
      # ARTICLE CONTENT
      # ====================================

      - name: sections
        label: Article Sections
        type: object
        list: true
        fields:
          - name: heading
            label: Section Heading
            type: string
            required: true

          - name: text
            label: Section Text
            type: rich-text
            required: true

      - name: filmUrl
        label: Film URL
        type: string

  # ========================================
  # EVENTS
  # ========================================

  - name: events
    label: Events
    type: collection
    path: content/events
    format: json
    filename: "{fields.slug}.json"

    fields:
      - name: name
        label: Event Name
        type: string
        required: true

      - name: slug
        label: Event ID
        type: string
        required: true

      - name: city
        label: City
        type: string

      - name: country
        label: Country
        type: string

      - name: category
        label: Event Category
        type: string

      - name: description
        label: Description
        type: text

      - name: website
        label: Official Website
        type: string

  # ========================================
  # CONTRIBUTORS
  # ========================================

  - name: contributors
    label: Contributors
    type: collection
    path: content/contributors
    format: json
    filename: "{fields.slug}.json"

    fields:
      - name: name
        label: Contributor Name
        type: string
        required: true

      - name: slug
        label: Contributor ID
        type: string
        required: true

      - name: brand
        label: Brand
        type: string

      - name: role
        label: Role
        type: string

      - name: instagram
        label: Instagram URL
        type: string

      - name: image
        label: Profile Image
        type: image

      - name: bio
        label: Biography
        type: text