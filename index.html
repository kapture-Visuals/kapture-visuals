  <body>
    <form
      name="contact"
      method="POST"

      <textarea name="message"></textarea>

    <script type="module" src="/src/main.jsx"></script>

    <script type="module">
      import * as CookieConsent from "https://cdn.jsdelivr.net/gh/orestbida/cookieconsent@3.0.1/dist/cookieconsent.esm.js";

      const loadGoogleAnalytics = () => {
        const script = document.createElement("script");
        script.async = true;
        script.src = "https://www.googletagmanager.com/gtag/js?id=G-NXYEF7RM21";
        document.head.appendChild(script);

        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        window.gtag = gtag;

        gtag("js", new Date());
        gtag("config", "G-NXYEF7RM21");
      };

      const loadMicrosoftClarity = () => {
        (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);
          t.async=1;
          t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];
          y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "x1azot4139");
      };

      CookieConsent.run({
        guiOptions: {
          consentModal: {
            layout: "bar",
            position: "bottom",
            equalWeightButtons: true,
            flipButtons: false
          },
          preferencesModal: {
            layout: "box",
            position: "right",
            equalWeightButtons: true,
            flipButtons: false
          }
        },

        categories: {
          necessary: {
            enabled: true,
            readOnly: true
          },
          analytics: {
            enabled: false
          }
        },

        language: {
          default: "en",
          translations: {
            en: {
              consentModal: {
                title: "Privacy Preferences",
                description: `
                    Kapture Visuals uses analytics cookies and similar technologies to understand website traffic,
                    improve performance and enhance the visitor experience. No advertising or marketing cookies are used.
                    Learn more in our <a href="/privacy-policy.html">Privacy Policy</a> and
                    <a href="/cookie-policy.html">Cookie Policy</a>.
                    `,
                acceptAllBtn: "Accept Analytics",
                acceptNecessaryBtn: "Reject",
                showPreferencesBtn: "Manage Preferences"
              },
              preferencesModal: {
                title: "Cookie Preferences",
                acceptAllBtn: "Accept Analytics",
                acceptNecessaryBtn: "Reject",
                savePreferencesBtn: "Save Preferences",
                closeIconLabel: "Close",
                sections: [
                  {
                    title: "Strictly Necessary Cookies",
                    description:
                      "These cookies are required for the website to function and cannot be disabled.",
                    linkedCategory: "necessary"
                  },
                  {
                    title: "Analytics Cookies",
                    description:
                      "These help us understand traffic sources, visits, clicks and how the website is used.",
                    linkedCategory: "analytics"
                  }
                ]
              }
            }
          }
        },

        onConsent: () => {
          if (CookieConsent.acceptedCategory("analytics")) {
            loadGoogleAnalytics();
            loadMicrosoftClarity();
          }
        },

        onChange: () => {
          if (CookieConsent.acceptedCategory("analytics")) {
            loadGoogleAnalytics();
            loadMicrosoftClarity();
          }
        }
      });
    </script>
  </body>
