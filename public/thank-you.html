<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | Kapture Visuals</title>

  <style>
    body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, sans-serif;
        color: white;

        background-image:
            linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.55)),
            url('/images/thank-you.jpg');

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;

        display: flex;
        align-items: center;
        justify-content: center;
    }

    .container {
      text-align: center;
      max-width: 900px;
      padding: 40px;
    }

    img {
      display: block;
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      margin-bottom: 24px;
    }

    p {
      color: rgba(255,255,255,.92);
      line-height: 1.8;
      max-width: 800px;
      margin: 0 auto 40px;
    }

    .buttons {
        display: flex;
        gap: 16px;
        justify-content: center;
        flex-wrap: wrap;
    }

    .primary,
    .secondary {
        display: inline-block;
        padding: 14px 28px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 600;
        transition: all .25s ease;
    }

    .primary {
        background: white;
        color: black;
    }

    .primary:hover {
        transform: translateY(-2px);
    }

    .secondary {
        border: 1px solid rgba(255,255,255,.2);
        color: white;
        background: rgba(255,255,255,.05);
    }

    .secondary:hover {
        background: rgba(255,255,255,.1);
        transform: translateY(-2px);
    }

    .logo {
        display: block;
        width: 450px;
        height: auto;
        margin-top: 45px auto 0;
        transform: translateX(75px);
    }
  </style>
</head>
  
<body>
  <div class="container">
    <h1>Project received.</h1>

    <p>
      Thank you for reaching out.
      <br />
      Your project request has been successfully submitted. We usually reply within one business day.
    </p>

    <div class="buttons">
      <a href="/" class="primary">
        Return Home
      </a>

      <a
        class="secondary"
        href="https://instagram.com/kapture.visuals.prod"
        target="_blank"
        rel="noopener noreferrer"
      >
        Follow on Instagram
      </a>
    </div>

    <img
      src="/images/thank-you.png"
      alt="Kapture Visuals"
      class="logo"
    />
  </div>
</body>
</html>
