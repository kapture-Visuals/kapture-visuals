<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | Kapture Visuals</title>

  <style>
    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Inter, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      max-width: 700px;
      padding: 40px;
    }

    img {
      width: 140px;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    p {
      color: rgba(255,255,255,.7);
      line-height: 1.8;
      margin-bottom: 30px;
    }

    .buttons {
        display: flex;
        gap: 16px;
        justify-content: center;
        flex-wrap: wrap;
    }

    .primary,
    .secondary {
        display: inline-block;
        padding: 14px 28px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 600;
        transition: all .25s ease;
    }

    .primary {
        background: white;
        color: black;
    }

    .primary:hover {
        transform: translateY(-2px);
    }

    .secondary {
        border: 1px solid rgba(255,255,255,.2);
        color: white;
        background: rgba(255,255,255,.05);
    }

    .secondary:hover {
        background: rgba(255,255,255,.1);
        transform: translateY(-2px);
    }
  </style>
</head>
  
<body>

  <div class="container">

    <img src="/images/footer.jpg" alt="Kapture Visuals">

    <h1>Project received.</h1>

    <p>
      Thank you for reaching out.
      You project request has been successfully submitted. We usually reply within one business day.
    </p>

    <div class="buttons">
      <a href="/" class="primary">
        Return Home
      </a>

      <a
        class="secondary"
        href="https://instagram.com/kapture.visuals.prod"
        target="_blank"
        rel="noopener noreferrer"
    >
      Follow on Instagram
    </a>
  </div>

</body>
</html>
