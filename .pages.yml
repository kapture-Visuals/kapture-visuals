media:
  input: public/images/journal
  output: /images/journal

content:
  - name: journal
    label: Journal Articles
    type: collection
    path: content/journal
    format: json
    filename: "{fields.slug}.json"
    view:
      fields:
        - title
        - eventStartDate
        - status
        - featured
      primary: title
      sort:
        - eventStartDate
        - title
    fields:
      - name: title
        label: Article Title
        type: string
        required: true

      - name: slug
        label: Article Slug
        type: string
        required: true

      - name: event
        label: Event ID
        type: string
        required: true

      - name: eventStartDate
        label: Event Start Date
        type: date

      - name: eventEndDate
        label: Event End Date
        type: date

      - name: city
        label: City
        type: string

      - name: country
        label: Country
        type: string

      - name: coverImage
        label: Cover Image
        type: image

      - name: excerpt
        label: Article Excerpt
        type: text

      - name: contributors
        label: Contributors
        type: reference
        options:
          collection: contributors
          multiple : true
          search : name
          value : "{fields.slug}"
          label : "{fields.name}"

      - name: status
        label: Publication Status
        type: select
        options:
          values:
            - draft
            - review
            - published

      - name: publishedAt
        label: Publication Date
        type: date

      - name: featured
        label: Featured Article
        type: boolean

      - name: sections
        label: Article Sections
        type: object
        list: true
        fields:
          - name: heading
            label: Section Heading
            type: string

          - name: text
            label: Section Text
            type: rich-text

          - name: blocks
            label: Editorial Blocks
            type: object
            list: true
            fields:
              - name: type
                label: Block Type
                type: select
                options:
                  values:
                    - image
                    - split
                    - pair
                    - grid-four
                    - editorial-three

              - name: position
                label: Position
                type: select
                options:
                  values:
                    - after-1
                    - after-2
                    - after-3
                    - after-4
                    - after-5
                    - after-6
                    - after-7
                    - after-8
                    - end

              - name: imagePosition
                label: Image Position
                type: select
                options:
                  values:
                    - left
                    - right

              - name: images
                label: Image Paths
                type: string
                list: true

              - name: caption
                label: Caption
                type: string

      - name: gallery
        label: Photo Gallery
        type: image
        list: true

      - name: filmUrl
        label: Film URL
        type: string

  - name: events
    label: Events
    type: collection
    path: content/events
    format: json
    filename: "{fields.slug}.json"
    fields:
      - name: name
        label: Event Name
        type: string
        required: true

      - name: slug
        label: Event ID
        type: string
        required: true

      - name: city
        label: City
        type: string

      - name: country
        label: Country
        type: string

      - name: category
        label: Event Category
        type: string

      - name: description
        label: Description
        type: text

      - name: website
        label: Official Website
        type: string

  - name: contributors
    label: Contributors
    type: collection
    path: content/contributors
    format: json
    filename: "{fields.slug}.json"
    fields:
      - name: name
        label: Contributor Name
        type: string
        required: true

      - name: slug
        label: Contributor ID
        type: string
        required: true

      - name: brand
        label: Brand
        type: string

      - name: role
        label: Role
        type: string

      - name: instagram
        label: Instagram URL
        type: string

      - name: image
        label: Profile Image
        type: image

      - name: bio
        label: Biography
        type: text