<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Thank You | Kapture Visuals</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, sans-serif;
      color: white;
      background: black;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .background-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: -1;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 900px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .eyebrow {
      margin-bottom: 18px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.35em;
      color: rgba(255,255,255,.55);
    }

    h1 {
      font-size: clamp(3rem, 6vw, 5rem);
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 0.95;
      margin: 0 0 28px;
    }

    p {
      max-width: 650px;
      margin: 0 auto 48px;
      color: rgba(255,255,255,.75);
      font-size: 1.05rem;
      line-height: 1.8;
    }

    .buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .primary,
    .secondary {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      transition: all .25s ease;
    }

    .primary {
      background: white;
      color: black;
    }

    .primary:hover,
    .secondary:hover {
      transform: translateY(-2px);
    }

    .secondary {
      border: 1px solid rgba(255,255,255,.2);
      color: white;
      background: rgba(255,255,255,.05);
    }

    .secondary:hover {
      background: rgba(255,255,255,.1);
    }

    .logo {
      display: block;
      width: min(450px, 85vw);
      height: auto;
      margin: 45px auto 0;
    }
  </style>
</head>

<body>
  <video class="background-video" autoplay muted loop playsinline preload="auto">
    <source src="/videos/thank-you.mp4" type="video/mp4" />
  </video>

  <div class="overlay"></div>

  <div class="container">
    <p class="eyebrow">Thank You</p>

    <h1>
      Project<br />
      received.
    </h1>

    <p>
      Thank you for reaching out.
      Your project request has been successfully submitted and is now under review.
      We typically reply within one business day.
    </p>

    <div class="buttons">
      <a href="/" class="primary">Return Home</a>

      <a
        class="secondary"
        href="https://instagram.com/kapture.visuals.eu"
        target="_blank"
        rel="noopener noreferrer"
      >
        Follow on Instagram
      </a>
    </div>

    <img
      src="/images/logo-white.jpg"
      alt="Kapture Visuals"
      class="logo"
    />
  </div>
</body>
</html>
