<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/jpeg" href="/images/favicon.jpg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kapture Visuals</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orestbida/cookieconsent@3.0.1/dist/cookieconsent.css"
    />

    <style>
      :root {
        --cc-bg: #ffffff;
        --cc-primary-color: #000000;
        --cc-secondary-color: #444444;
        --cc-btn-primary-bg: #000000;
        --cc-btn-primary-color: #ffffff;
        --cc-btn-secondary-bg: #ffffff;
        --cc-btn-secondary-color: #000000;
        --cc-btn-secondary-border-color: #000000;
        --cc-modal-border-radius: 18px;
      }

      #cc-main .cm {
        max-width: none;
        width: calc(100% - 48px);
        margin: 0 24px 24px;
        border-radius: 18px;
      }

      #cc-main .cm__body {
        max-width: 1200px;
        margin: 0 auto;
      }

      #cc-main .cm__texts {
        max-width: 760px;
      }

      #cc-main .cm__btns {
        display: flex;
        flex-direction: row;
        gap: 12px;
      }
    </style>
  </head>

  <body>
    <form
      name="contact"
      method="POST"
      action="/thank-you.html"
      netlify
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="contact" />
      <input name="client_type" />
      <input name="name" />
      <input name="email" />
      <input name="phone" />
      <input name="services" />
      <textarea name="message"></textarea>
    </form>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

    <script type="module">
      import * as CookieConsent from "https://cdn.jsdelivr.net/gh/orestbida/cookieconsent@3.0.1/dist/cookieconsent.esm.js";

      const loadGoogleAnalytics = () => {
        const script = document.createElement("script");
        script.async = true;
        script.src = "https://www.googletagmanager.com/gtag/js?id=G-NXYEF7RM21";
        document.head.appendChild(script);

        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        window.gtag = gtag;

        gtag("js", new Date());
        gtag("config", "G-NXYEF7RM21");
      };

      const loadMicrosoftClarity = () => {
        (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);
          t.async=1;
          t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];
          y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "x1azot4139");
      };

      CookieConsent.run({
        guiOptions: {
          consentModal: {
            layout: "bar",
            position: "bottom",
            equalWeightButtons: true,
            flipButtons: false
          },
          preferencesModal: {
            layout: "box",
            position: "right",
            equalWeightButtons: true,
            flipButtons: false
          }
        },

        categories: {
          necessary: {
            enabled: true,
            readOnly: true
          },
          analytics: {
            enabled: false
          }
        },

        language: {
          default: "en",
          translations: {
            en: {
              consentModal: {
                title: "Privacy Preferences",
                description:
                  "Kapture Visuals uses analytics cookies and similar technologies to understand website traffic, improve performance and enhance the visitor experience. No advertising or marketing cookies are used. Learn more in our Privacy Policy and Cookie Policy.",
                acceptAllBtn: "Accept Analytics",
                acceptNecessaryBtn: "Reject",
                showPreferencesBtn: "Manage Preferences"
              },
              preferencesModal: {
                title: "Cookie Preferences",
                acceptAllBtn: "Accept Analytics",
                acceptNecessaryBtn: "Reject",
                savePreferencesBtn: "Save Preferences",
                closeIconLabel: "Close",
                sections: [
                  {
                    title: "Strictly Necessary Cookies",
                    description:
                      "These cookies are required for the website to function and cannot be disabled.",
                    linkedCategory: "necessary"
                  },
                  {
                    title: "Analytics Cookies",
                    description:
                      "These help us understand traffic sources, visits, clicks and how the website is used.",
                    linkedCategory: "analytics"
                  }
                ]
              }
            }
          }
        },

        onConsent: () => {
          if (CookieConsent.acceptedCategory("analytics")) {
            loadGoogleAnalytics();
            loadMicrosoftClarity();
          }
        },

        onChange: () => {
          if (CookieConsent.acceptedCategory("analytics")) {
            loadGoogleAnalytics();
            loadMicrosoftClarity();
          }
        }
      });
    </script>
  </body>
</html>
